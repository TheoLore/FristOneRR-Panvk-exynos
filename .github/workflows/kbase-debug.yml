---
name: PanVK Android kbase driver package

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-panvk-android:
    name: Build Android PanVK kbase driver
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: panvk-mali-kbase-android
      HOST_BUILD_DIR: build-host
      ANDROID_BUILD_DIR: build-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bison \
            build-essential \
            ca-certificates \
            clang \
            libdrm-dev \
            flex \
            libelf-dev \
            libexpat1-dev \
            libclang-cpp-dev \
            libclang-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            ninja-build \
            pkgconf \
            python3 \
            python3-mako \
            python3-packaging \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            llvm-dev \
            glslang-tools \
            spirv-tools \
            zlib1g-dev \
            zip
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "libclc-${LLVM_MAJOR}-dev" \
            "libllvmspirvlib-${LLVM_MAJOR}-dev"

      - name: Install Meson
        run: |
          python3 -m pip install --break-system-packages \
            'meson>=1.4.0,<2'

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android API 36 and NDK
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Build native shader tools
        shell: bash
        run: |
          set -euo pipefail
          HOST_PREFIX="${GITHUB_WORKSPACE}/host-tools"
          CC=clang CXX=clang++ meson setup "${HOST_BUILD_DIR}" \
            --buildtype=release \
            -Dprefix="${HOST_PREFIX}" \
            -Dlibdir=lib \
            -Dbuild-tests=false \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dpanfrost-kmds=kbase \
            -Dpanfrost-rust=false \
            -Dllvm=enabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled
          meson compile -C "${HOST_BUILD_DIR}" -j "$(nproc)"
          meson install -C "${HOST_BUILD_DIR}"

      - name: Configure Android driver
        shell: bash
        run: |
          set -euo pipefail
          HOST_PREFIX="${GITHUB_WORKSPACE}/host-tools"
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          EMPTY_PKGCONFIG="${RUNNER_TEMP}/empty-pkgconfig"
          mkdir -p "${EMPTY_PKGCONFIG}"
          export PATH="${NDK_BIN}:${HOST_PREFIX}/bin:${PATH}"
          # Keep the Android target from discovering host libdrm.pc files.
          export PKG_CONFIG_LIBDIR="${EMPTY_PKGCONFIG}"

          sed \
            -e "s#^c = .*#c = ['${NDK_BIN}/clang', '--target=aarch64-linux-android35', '--sysroot=${NDK_SYSROOT}']#" \
            -e "s#^cpp = .*#cpp = ['${NDK_BIN}/clang++', '--target=aarch64-linux-android35', '--sysroot=${NDK_SYSROOT}']#" \
            -e "s#^ar = .*#ar = '${NDK_BIN}/llvm-ar'#" \
            -e "s#^strip = .*#strip = '${NDK_BIN}/llvm-strip'#" \
            -e "s#/data/data/com.termux/files/home/mesa/build-host/src/util/mesa_clc#${HOST_PREFIX}/bin/mesa_clc#" \
            android-cross.txt > "${RUNNER_TEMP}/android-cross-ci.txt"

          meson setup "${ANDROID_BUILD_DIR}" \
            --cross-file "${RUNNER_TEMP}/android-cross-ci.txt" \
            --buildtype=release \
            --prefix=/usr \
            --libdir=lib \
            $(cat tools/fristonerr/build-options.txt) \
            -Dplatform-sdk-version=35 \
            -Dzstd=disabled \
            -Dallow-fallback-for=libdrm \
            -Dgallium-drivers= \
            -Dpanfrost-rust=false

      - name: Build Android PanVK
        run: meson compile -C "${ANDROID_BUILD_DIR}" -j "$(nproc)"

      - name: Package Android driver
        id: package
        shell: bash
        run: |
          set -euo pipefail

          MESA_VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="Panvk-Mali-Kbase-beta_${MESA_VERSION}"
          PACKAGE_DIR="${GITHUB_WORKSPACE}/artifacts/${PACKAGE_VERSION}"
          DRIVER="libvulkan_panfrost.so"
          mkdir -p "${PACKAGE_DIR}"
          install -m755 \
            "${ANDROID_BUILD_DIR}/src/panfrost/vulkan/libvulkan_panfrost.so" \
            "${PACKAGE_DIR}/${DRIVER}"
          install -m644 docs/license.rst "${PACKAGE_DIR}/LICENSE-Mesa.txt"

          DRIVER_SIZE="$(stat -c '%s' "${PACKAGE_DIR}/${DRIVER}")"
          MAX_DRIVER_SIZE=22000000
          if (( DRIVER_SIZE > MAX_DRIVER_SIZE )); then
            echo "Driver is ${DRIVER_SIZE} bytes; maximum is ${MAX_DRIVER_SIZE}." >&2
            exit 1
          fi
          readelf -h "${PACKAGE_DIR}/${DRIVER}" | grep -q 'Machine:.*AArch64'
          readelf -d "${PACKAGE_DIR}/${DRIVER}" | grep -q 'liblog.so'

          python3 - \
            "${PACKAGE_DIR}/${DRIVER}" \
            "${PACKAGE_DIR}/meta.json" \
            "${DRIVER}" \
            "${MESA_VERSION}" \
            "${PACKAGE_VERSION}" <<'PY'
          import hashlib
          import json
          import sys

          library, meta_path, library_name, mesa_version, package_version = sys.argv[1:]
          with open(library, "rb") as driver:
              driver_hash = hashlib.sha256(driver.read()).hexdigest()

          metadata = {
              "author": "FirstOneRR",
              "description": f"PanVK for Mali (kbase), {package_version}",
              "driverVersion": f"Mesa {mesa_version} / PanVK kbase",
              "libraryName": library_name,
              "minApi": 36,
              "name": package_version,
              "packageVersion": package_version,
              "sanitizedArtifactSha256": driver_hash,
              "schemaVersion": 1,
              "vendor": "Mesa",
          }
          with open(meta_path, "w", encoding="utf-8") as output:
              json.dump(metadata, output, indent=2)
              output.write("\n")
          PY

          OUTPUT_ZIP="${GITHUB_WORKSPACE}/${PACKAGE_VERSION}.zip"
          (cd "${PACKAGE_DIR}" && zip -j "${OUTPUT_ZIP}" \
            "${DRIVER}" meta.json LICENSE-Mesa.txt)
          jq -e '.schemaVersion == 1 and .minApi == 36 and .libraryName == "libvulkan_panfrost.so"' \
            "${PACKAGE_DIR}/meta.json" >/dev/null
          test "$(unzip -Z1 "${OUTPUT_ZIP}" | sort | tr '\n' ' ')" = \
            'LICENSE-Mesa.txt libvulkan_panfrost.so meta.json '
          echo "file=${OUTPUT_ZIP}" >> "${GITHUB_OUTPUT}"

      - name: Upload standalone driver
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-logs
          path: |
            ${{ github.workspace }}/${{ env.ANDROID_BUILD_DIR }}/meson-logs
            ${{ github.workspace }}/${{ env.HOST_BUILD_DIR }}/meson-logs
          if-no-files-found: ignore
          retention-days: 7
